services:
  # PostgreSQL database for Listmonk (isolated on localhost & internal network)
  listmonk-db:
    image: postgres:15-alpine
    container_name: 8020-listmonk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LISTMONK_DB_USER}
      POSTGRES_PASSWORD: ${LISTMONK_DB_PASSWORD}
      POSTGRES_DB: ${LISTMONK_DB_NAME}
    volumes:
      - listmonk-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${LISTMONK_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - 8020-network

  # Listmonk Campaign Engine (bound to localhost)
  listmonk:
    image: listmonk/listmonk:latest
    container_name: 8020-listmonk-app
    restart: unless-stopped
    depends_on:
      listmonk-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      - LISTMONK_app__address=0.0.0.0:9000
      - LISTMONK_app__admin_username=${LISTMONK_API_USERNAME}
      - LISTMONK_app__admin_password=${LISTMONK_API_PASSWORD}
      - LISTMONK_db__user=${LISTMONK_DB_USER}
      - LISTMONK_db__password=${LISTMONK_DB_PASSWORD}
      - LISTMONK_db__database=${LISTMONK_DB_NAME}
      - LISTMONK_db__host=listmonk-db
      - LISTMONK_db__port=5432
      - LISTMONK_db__ssl_mode=disable
    volumes:
      - listmonk-uploads:/listmonk/uploads
      - ./listmonk/config.toml:/listmonk/config.toml:ro
    command: [ "sh", "-c", "./listmonk --install --idempotent --yes && ./listmonk --config config.toml" ]
    networks:
      - 8020-network

volumes:
  listmonk-postgres-data:
    name: 8020-listmonk-postgres-data
  listmonk-uploads:
    name: 8020-listmonk-uploads

networks:
  8020-network:
    name: 8020-outbound-network
    driver: bridge
